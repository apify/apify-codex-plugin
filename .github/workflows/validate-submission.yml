name: Validate public submission candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/build-submission.py
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: apify-public-submission-candidate
          path: |
            dist/*-candidate.zip
            dist/*-candidate.readiness.json
