name: Create a release

# Push-button release: run this from the Actions tab (no manual tagging).
# git-cliff derives the version from conventional commits, we bump plugin.json
# and CHANGELOG.md in one commit on main, then tag and release that commit.
#
# The first release must use release_type "custom": "auto" needs a prior tag.
#
# Prerequisite: `main` must accept direct pushes from GitHub Actions (no branch
# protection requiring PRs).

permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        type: choice
        default: auto
        options: [auto, custom, patch, minor, major]
      custom_version:
        description: The custom version to bump to (only for "custom" type)
        required: false
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

env:
  PLUGIN_MANIFEST: apify/.codex-plugin/plugin.json

jobs:
  release_metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      version_number: ${{ steps.release_metadata.outputs.version_number }}
      tag_name: ${{ steps.release_metadata.outputs.tag_name }}
      changelog: ${{ steps.release_metadata.outputs.changelog }}
      release_notes: ${{ steps.release_metadata.outputs.release_notes }}
      is_prerelease: ${{ steps.validate_version.outputs.is_prerelease }}
    steps:
      - name: Verify running on main in the expected repository
        if: github.ref != 'refs/heads/main' || github.repository != 'apify/apify-codex-plugin'
        run: |
          echo "::error title=Wrong branch or repository::Releases must run from main in apify/apify-codex-plugin. ref=${GITHUB_REF} repo=${GITHUB_REPOSITORY}"
          exit 1

      - name: Validate inputs
        if: inputs.release_type == 'custom' && inputs.custom_version == ''
        run: |
          echo "::error title=Missing custom_version::release_type is 'custom' but custom_version is empty. Provide a custom version (e.g. 1.2.0) and re-run the workflow."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: apify/actions/git-cliff-release@v1.1.2
        name: Prepare release metadata
        id: release_metadata
        with:
          release_type: ${{ inputs.release_type }}
          custom_version: ${{ inputs.custom_version }}
          existing_changelog_path: CHANGELOG.md

      - name: Validate version
        id: validate_version
        env:
          VERSION: ${{ steps.release_metadata.outputs.version_number }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error title=Invalid version::'${VERSION}' is not a valid semantic version. See https://semver.org"
            exit 1
          fi

          if [[ "${VERSION%%+*}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  bump_and_changelog:
    name: Bump manifest and update changelog
    needs: [release_metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Update version in plugin.json
        env:
          VERSION: ${{ needs.release_metadata.outputs.version_number }}
        run: |
          node -e '
            const fs = require("fs");
            const file = process.env.PLUGIN_MANIFEST;
            const content = fs.readFileSync(file, "utf8");
            const updated = content.replace(/("version"\s*:\s*)"[^"]+"/, `$1"${process.env.VERSION}"`);
            JSON.parse(updated);
            fs.writeFileSync(file, updated, "utf8");
          '
          jq -e --arg v "$VERSION" '.version == $v' "$PLUGIN_MANIFEST" > /dev/null

      - name: Write updated CHANGELOG.md
        env:
          CHANGELOG: ${{ needs.release_metadata.outputs.changelog }}
        run: printf '%s\n' "$CHANGELOG" > CHANGELOG.md

      - name: Commit and push
        id: commit
        env:
          VERSION: ${{ needs.release_metadata.outputs.version_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PLUGIN_MANIFEST" CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          # Not forced: if main moved since dispatch, fail instead of releasing
          # commits the changelog doesn't describe.
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create_github_release:
    name: Create GitHub release
    needs: [release_metadata, bump_and_changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ needs.release_metadata.outputs.tag_name }}
          name: ${{ needs.release_metadata.outputs.version_number }}
          body: ${{ needs.release_metadata.outputs.release_notes }}
          target_commitish: ${{ needs.bump_and_changelog.outputs.sha }}
          prerelease: ${{ needs.release_metadata.outputs.is_prerelease == 'true' }}
